name: Build TabGO Graphics Tablet

on:
  workflow_dispatch:
  push:
    branches: [tabgo-native-v1]

permissions:
  contents: read

concurrency:
  group: tabgo-graphics-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows:
    name: Build TabGO.exe
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: windows/requirements.txt
      - name: Install desktop dependencies
        run: python -m pip install -r windows/requirements.txt pyinstaller
      - name: Syntax check
        run: python -m compileall -q windows
      - name: Package standalone Windows executable
        run: pyinstaller --noconfirm --clean --onefile --windowed --name TabGO windows/tabgo.py
      - uses: actions/upload-artifact@v4
        with:
          name: TabGO-Windows-EXE
          path: dist/TabGO.exe
          if-no-files-found: error

  android:
    name: Build TabGO Android APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
      - name: Build Android debug APK
        working-directory: android
        run: gradle assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: TabGO-Android-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

  package:
    name: Package TabGO
    needs: [windows, android]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: TabGO-Windows-EXE
          path: dist/TabGO
      - uses: actions/download-artifact@v4
        with:
          name: TabGO-Android-APK
          path: dist/TabGO
      - name: Prepare release ZIP
        run: |
          mv dist/TabGO/app-debug.apk dist/TabGO/TabGO-Android.apk
          cp windows/README.txt dist/TabGO/README.txt
          cd dist && zip -r TabGO-Graphics-Tablet.zip TabGO
      - uses: actions/upload-artifact@v4
        with:
          name: TabGO-Graphics-Tablet
          path: dist/TabGO-Graphics-Tablet.zip
          if-no-files-found: error
